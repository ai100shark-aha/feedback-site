<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매일방탈출</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:420px">

  <h1 class="h5 fw-bold mb-1">🔓 매일방탈출</h1>
  <p class="text-muted small mb-3">수업 시작 전, 복습 문제 3개를 풀고 탈출하세요!<br>
     탈출시간이 짧을수록, 힌트를 적게 쓸수록 순위가 올라갑니다.</p>

  {% if error %}
  <div class="alert alert-warning py-2 small">{{ error }}</div>
  {% endif %}

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        <div class="mb-2">
          <label class="form-label fw-bold small">학번 (5자리)</label>
          <input type="text" name="student_id" class="form-control" maxlength="5"
                 inputmode="numeric" pattern="\d{5}" placeholder="예: 10113" required autofocus>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold small">번호</label>
          <input type="text" name="student_num" class="form-control" maxlength="2"
                 inputmode="numeric" placeholder="예: 13" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold small">이름</label>
          <input type="text" name="student_name" class="form-control" placeholder="홍길동" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">🚪 입장해서 탈출 시작!</button>
      </form>
    </div>
  </div>

  <div class="text-center mt-3">
    <a href="/" class="btn btn-link btn-sm text-muted">← 메인으로</a>
  </div>

</div>
</body>
</html>
