<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브레인스토밍 참여</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:480px">

  <h1 class="h5 fw-bold mb-3">💭 브레인스토밍 참여</h1>

  {% if error %}
  <div class="alert alert-warning py-2 small">{{ error }}</div>
  {% endif %}

  {% if not question %}
  <!-- 코드 입력 -->
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="GET">
        <label class="form-label fw-bold">참여 코드 4자리</label>
        <div class="input-group">
          <input type="text" name="code" class="form-control form-control-lg text-center"
                 style="letter-spacing:.3em; font-weight:700"
                 placeholder="0000" maxlength="4" inputmode="numeric"
                 value="{{ code }}" required autofocus>
          <button class="btn btn-primary">입장</button>
        </div>
        <div class="form-text">선생님이 알려준 코드를 입력하세요.</div>
      </form>
    </div>
  </div>

  {% else %}
  <!-- 단어 입력 -->
  <div class="card shadow-sm mb-3" style="border-left:4px solid #2f5496">
    <div class="card-body py-3">
      <div class="text-muted small mb-1">질문</div>
      <div class="fs-5 fw-bold">{{ question }}</div>
    </div>
  </div>

  {% if success %}
  <div class="alert alert-success py-2">
    <b>{{ success }}</b> 보냈어요! 더 보내도 됩니다 👍
  </div>
  {% endif %}

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="code" value="{{ code }}">
        <label class="form-label fw-bold">떠오르는 단어를 입력하세요</label>
        <div class="input-group input-group-lg">
          <input type="text" name="word" class="form-control"
                 placeholder="예: 실천" maxlength="20" required autofocus autocomplete="off">
          <button class="btn btn-primary">보내기</button>
        </div>
        <div class="form-text">짧은 단어일수록 좋아요. 여러 번 보낼 수 있습니다.</div>
      </form>
    </div>
  </div>

  <div class="text-center mt-3">
    <span class="badge bg-secondary">내가 보낸 개수: {{ sent }}</span>
  </div>
  <div class="text-center mt-2">
    <a href="/cloud/join/" class="btn btn-link btn-sm text-muted">다른 코드로 참여</a>
  </div>
  {% endif %}

</div>
</body>
</html>
